
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header class="profile">

            <img
                class="profile-pic"
                src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&h=300&q=80"
                alt="Profile Picture"
            >

            <div class="profile-info">
                <h1>Nisha</h1>
                <p>Travel Photographer | Exploring the World</p>
            </div>

            <div class="stats">
                <div>
                    <h2>150</h2>
                    <p>Posts</p>
                </div>

                <div>
                    <h2>5K</h2>
                    <p>Followers</p>
                </div>

                <div>
                    <h2>300</h2>
                    <p>Following</p>
                </div>
            </div>

        </header>

        <section class="banner">
            <h2>NEW COLLECTION</h2>
            <p>Beautiful moments from around the world</p>
        </section>

        <main class="gallery">

            <div class="photo big-photo">
                <img src="https://picsum.photos/id/1015/600/600"
                     alt="Mountain landscape">
            </div>

            <div class="photo">
                <img src="https://picsum.photos/id/1011/400/300"
                     alt="Mountain and lake">
            </div>

            <div class="photo">
                <img src="https://picsum.photos/id/1016/400/300"
                     alt="Green nature">
            </div>

            <div class="photo">
                <img src="https://picsum.photos/id/1018/400/300"
                     alt="Mountain view">
            </div>

            <div class="photo wide-photo">
                <img src="https://picsum.photos/id/1020/600/300"
                     alt="Green forest">
            </div>

            <div class="photo">
                <img src="https://picsum.photos/id/1024/400/300"
                     alt="Animal photography">
            </div>

            <div class="photo">
                <img src="https://picsum.photos/id/1035/400/300"
                     alt="Beautiful waterfall">
            </div>

            <div class="photo">
                <img src="https://picsum.photos/id/1036/400/300"
                     alt="Travel destination">
            </div>

            <div class="photo">
                <img src="https://picsum.photos/id/1040/400/300"
                     alt="Mountain scenery">
            </div>

            <div class="photo">
                <img src="https://picsum.photos/id/1043/400/300"
                     alt="Nature photography">
            </div>

            <div class="photo">
                <img src="https://picsum.photos/id/1050/400/300"
                     alt="Forest landscape">
            </div>

            <div class="photo">
                <img src="https://picsum.photos/id/106/400/300"
                     alt="Travel photo">
            </div>

        </main>

        <footer>
            <p>© 2026 Areeba Khan's Gallery | All Rights Reserved</p>
        </footer>

    </div>

</body>
</html>
